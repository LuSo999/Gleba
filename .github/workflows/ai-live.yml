name: AI live test

# Sends the sample receipts / label in test_ai/fixtures to the real AI
# providers whose keys are stored as repository secrets. Manual only.
on:
  workflow_dispatch:
    inputs:
      bench_models:
        description: 'Comma-separated Gemini models to benchmark (empty = normal live test)'
        required: false
        default: ''

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run live AI tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BENCH_MODELS: ${{ inputs.bench_models }}
        run: |
          if [ -n "$BENCH_MODELS" ]; then
            flutter test test_ai/bench_test.dart --reporter expanded
          else
            flutter test test_ai/live_ai_test.dart --reporter expanded
          fi
