name: Deploy to Firebase

# Deploys the web app (Hosting), the notification/AI server (Cloud Functions)
# and Firestore rules. Runs on every push to main, or manually:
# Actions → Deploy to Firebase → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install and test functions
        working-directory: functions
        run: |
          npm ci
          npm test

      - name: Build web app
        run: |
          flutter pub get
          flutter build web --release

      - name: Write service account key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Missing secret FIREBASE_SERVICE_ACCOUNT (see README → Nasazení serveru)"; exit 1
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"

      - name: Deploy hosting, functions and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@latest deploy --only hosting,functions,firestore --project gleba-e9a60 --non-interactive --force

      - name: Store the Open Food Facts app account (optional)
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          OFF_USER_ID: ${{ secrets.OFF_USER_ID }}
          OFF_PASSWORD: ${{ secrets.OFF_PASSWORD }}
          OFF_SALT: ${{ secrets.OFF_SALT }}
        run: node scripts/set-off-config.mjs
