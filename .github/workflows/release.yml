name: Release (Google Play)

# Builds the signed app bundle (AAB) for Google Play.
# Run manually (Actions → Release → Run workflow) or by pushing a tag v1.2.3.
# Needs secrets: GLEBA_UPLOAD_KEYSTORE_BASE64, GLEBA_UPLOAD_STORE_PASSWORD,
# GLEBA_UPLOAD_KEY_PASSWORD (alias "upload"). With PLAY_SERVICE_ACCOUNT it
# also uploads the bundle to Play (internal testing track, as a draft).
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track (internal, alpha, beta, production)'
        default: internal
  push:
    tags: ['v*']

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      # The Android build needs more disk than the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk/2* /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune -af >/dev/null 2>&1 || true

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.GLEBA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Missing secret GLEBA_UPLOAD_KEYSTORE_BASE64 (see docs/google-play.md)"; exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build app bundle
        env:
          GLEBA_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          GLEBA_UPLOAD_STORE_PASSWORD: ${{ secrets.GLEBA_UPLOAD_STORE_PASSWORD }}
          GLEBA_UPLOAD_KEY_PASSWORD: ${{ secrets.GLEBA_UPLOAD_KEY_PASSWORD }}
          GLEBA_UPLOAD_KEY_ALIAS: upload
        run: |
          flutter pub get
          # Every Play upload needs a higher versionCode: use the run number.
          flutter build appbundle --release --build-number=$((100 + ${{ github.run_number }}))

      - uses: actions/upload-artifact@v4
        with:
          name: gleba-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Check Play access
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: echo "enabled=$([ -n "$SA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: com.gleba.food.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track || 'internal' }}
          status: draft
