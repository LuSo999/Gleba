name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Build Android APK (debug)
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: gleba-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # Easy download on the phone: every build of main replaces the APK in
      # the "latest" pre-release (Releases → Nejnovější verze).
      - name: Publish APK to the 'latest' release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          cp build/app/outputs/flutter-apk/app-debug.apk gleba.apk
          notes="Sestaveno z ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest gleba.apk --target "$GITHUB_SHA" --prerelease \
            --title "Nejnovější verze" --notes "$notes"

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - run: npm ci
      - run: npm test
