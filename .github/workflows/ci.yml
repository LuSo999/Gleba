name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The Android build needs more disk than the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk/2* /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Build Android APK (debug)
        # arm64 only: every phone from the last years, a third of the size.
        run: flutter build apk --debug --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: gleba-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # Easy download on the phone: every build of main replaces the APK in
      # the "latest" pre-release (Releases → Nejnovější verze).
      - name: Publish APK to the 'latest' release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          df -h . || true
          # The runner disk is nearly full after the Gradle build; free it
          # before writing anything (a full disk kills the step without logs).
          rm -rf ~/.gradle/caches build/web build/app/intermediates /usr/share/dotnet /opt/ghc || true
          df -h . || true
          mv build/app/outputs/flutter-apk/app-debug.apk gleba.apk
          notes="Sestaveno z ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest gleba.apk --target "$GITHUB_SHA" --prerelease \
            --title "Nejnovější verze" --notes "$notes"

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - run: npm ci
      - run: npm test
