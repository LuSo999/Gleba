<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9B6BE0"/>
      <stop offset="0.6" stop-color="#7340C6"/>
      <stop offset="1" stop-color="#4E2296"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="loafClip">
      <path id="loafPath" d="M190 600 C 190 440, 330 360, 512 360 C 694 360, 834 440, 834 600 C 834 690, 770 718, 700 718 L 324 718 C 254 718, 190 690, 190 600 Z"/>
    </clipPath>
  </defs>
  <ellipse cx="512" cy="730" rx="320" ry="28" fill="#2B1150" opacity="0.16"/>
  <g clip-path="url(#loafClip)">
    <rect x="150" y="340" width="724" height="400" fill="url(#crust)"/>
    <!-- darker baked bottom -->
    <rect x="150" y="668" width="724" height="60" fill="#3E1A7A" opacity="0.55"/>
    <rect x="150" y="340" width="724" height="400" fill="url(#shine)"/>
    <!-- scoring: three diagonal slashes across the top, opened crumb inside -->
    <g fill="#EBDDFF" stroke="#C9A8F5" stroke-width="6" stroke-linejoin="round">
      <path d="M282 500 C 312 430, 370 392, 425 384 C 400 428, 350 472, 300 512 Z"/>
      <path d="M440 398 C 485 372, 545 370, 590 380 C 548 404, 492 414, 446 418 Z"/>
      <path d="M600 384 C 655 392, 712 430, 742 500 C 724 512, 674 472, 620 424 Z"/>
    </g>
    <!-- flour dusting -->
    <g fill="#FFFFFF" opacity="0.55">
      <circle cx="360" cy="440" r="5"/><circle cx="520" cy="430" r="4"/><circle cx="660" cy="445" r="5"/>
      <circle cx="430" cy="455" r="3"/><circle cx="600" cy="462" r="3"/><circle cx="290" cy="520" r="4"/>
      <circle cx="740" cy="515" r="4"/><circle cx="480" cy="470" r="3"/>
    </g>
  </g>
  <text x="512" y="672" text-anchor="middle"
        font-family="'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="250" fill="#FFF4DC">G</text>
</svg>
